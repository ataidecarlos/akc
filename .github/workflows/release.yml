name: release

# Builds every release asset natively on GitHub-hosted runners and attaches them
# to a release. Nothing is cross-compiled and nothing is built locally.
# `akc --update` reads the GitHub Releases API, so this workflow -- not the
# repository -- is the source of truth for published binaries.
#
# Run it by hand to (re)build an existing tag:
#   gh workflow run release.yml -f tag=v5.0.0
# or by pushing a tag (the release is created if it does not exist yet).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload the assets to
        required: true
        default: v5.0.0
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: akc-linux-x86_64
            exe: ""
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: akc-linux-aarch64
            exe: ""
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            asset: akc-windows-x86_64.exe
            exe: ".exe"
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset: akc-windows-aarch64.exe
            exe: ".exe"
          - runner: macos-latest
            target: aarch64-apple-darwin
            asset: akc-macos-aarch64
            exe: ""

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # ring (via rustls) compiles C, so a musl target needs musl-gcc; the Rust
      # target alone is not enough.
      - name: Install musl toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/akc${{ matrix.exe }}" \
             "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum akc-* > checksums.txt
          cat checksums.txt

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout in this job, so gh cannot infer the repository.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" > /dev/null 2>&1 || \
            gh release create "$TAG" --title "akc ${TAG#v}" --generate-notes
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --latest
